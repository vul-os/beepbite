# .github/workflows/test.yml
# CI: Go build/vet + Go tests + HTTP smoke suites + frontend build + Vitest unit tests on every push/PR.
# Playwright E2E is a separate optional job (needs a browser binary).

name: test

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  # ---------- Go ----------
  go-build:
    name: Go build, vet & test
    # Pinned to 22.04: the integration tests use testcontainers (Docker) via
    # testenv.StartPostgres, which is unreliable on the ubuntu-latest image
    # (currently Ubuntu 26+). The suite passes locally on Docker; pinning gives
    # CI the same stable Docker/testcontainers path. Same rationale the
    # Playwright job note below records.
    runs-on: ubuntu-22.04

    # Postgres service container for the HTTP smoke suites.
    # The server and `go run ./cmd/tests --all` connect to this instance.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: beepbite
          POSTGRES_PASSWORD: beepbite
          POSTGRES_DB: beepbite_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beepbite"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Required by config.Load() — DATABASE_URL and JWT_SECRET are the only
      # mandatory fields (all others have safe defaults or are optional).
      DATABASE_URL: postgres://beepbite:beepbite@localhost:5432/beepbite_ci?sslmode=disable
      JWT_SECRET: ci-test-secret-do-not-use-in-prod
      APP_ENV: local
      PORT: 8080
      # Expose DATABASE_URL to the e2e package tests via TEST_DATABASE_URL so
      # that helper_test.go's openPool() (which reads TEST_DATABASE_URL) is
      # satisfied without Docker — testenv falls back to a scratch DB on the
      # service container when Docker is unavailable.
      TEST_DATABASE_URL: postgres://beepbite:beepbite@localhost:5432/beepbite_ci?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        # Must be >= the version backend/go.mod requires (1.25.0). It said 1.22
        # for a long while and the jobs still went green, because the toolchain
        # line makes Go download a newer one on demand — which is a fallback,
        # not a guarantee: it needs network access to the module proxy at build
        # time and it silently produces a different toolchain than the one the
        # runner installed. Pinning the real requirement means a version bump in
        # go.mod fails here loudly instead of changing what CI quietly fetches.
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # -----------------------------------------------------------------------
      # Static analysis
      # -----------------------------------------------------------------------

      - name: go build
        working-directory: backend
        run: go build ./...

      - name: gofmt check
        working-directory: backend
        # Fails if any .go file is not gofmt-formatted.
        # A separate gofmt pass is run over the repo before merging;
        # remove this gate only after all formatting debt is cleared.
        run: gofmt -l . | tee /tmp/gofmt.out; test ! -s /tmp/gofmt.out

      - name: go vet
        working-directory: backend
        run: go vet ./...

      # -----------------------------------------------------------------------
      # Unit / integration tests (go test ./...)
      #
      # testenv.StartPostgres() tries Docker first (testcontainers); when Docker
      # is unavailable on the runner it falls back to a scratch DB on the
      # Postgres service container above (reads DATABASE_URL / TEST_DATABASE_URL).
      # The e2e tests in cmd/tests/e2e use TEST_DATABASE_URL directly and skip
      # gracefully when neither path works, so this step never fails hard due to
      # a missing Docker daemon.
      # -----------------------------------------------------------------------

      - name: go test (unit + integration)
        working-directory: backend
        run: go test ./...

      # -----------------------------------------------------------------------
      # Multi-branch merge suite (ROADMAP Stage 2, precondition 4)
      #
      # `go test ./...` above already runs this. It is named again here, on
      # purpose, for the same reason the sync-vectors job asserts a count: a
      # precondition in the ROADMAP is now recorded as met BECAUSE this suite
      # passes, and a suite that has been renamed, moved or emptied would go on
      # producing a green tick from the line above with nobody noticing which
      # claim stopped being checked.
      #
      # The grep is the assertion, not the exit code. `-run` matching nothing
      # exits 0, so the four properties the precondition names are checked for
      # by name in the verbose output.
      # -----------------------------------------------------------------------
      - name: Merge suite under induced partition
        working-directory: backend
        run: |
          set -euo pipefail
          go test ./internal/sync/opsink/ -run 'TestConcurrent|TestTwoSales|TestOrderNumbers|TestHealed|TestConverged' -v \
            | tee /tmp/merge.out
          for want in \
            TestConcurrentSalesOfTheLastUnitConvergeAtMinusTwo \
            TestConcurrentMenuEditsResolveIdenticallyOnBothEngines \
            TestOrderNumbersDoNotCollideAcrossBranches \
            TestHealedPartitionMatchesAnUnpartitionedDrawer \
            TestConvergedStateIsByteIdenticalOverEveryExchangeOrder
          do
            if ! grep -q "^--- PASS: ${want} " /tmp/merge.out; then
              echo "::error::${want} did not run and pass. ROADMAP Stage 2 precondition 4 records this suite as met; it is not." >&2
              exit 1
            fi
          done
          echo "all five merge properties ran and passed"

      # The ownership registry is only worth what its agreement with the schema
      # is worth, and that agreement is a fail-closed test rather than a habit.
      # Named separately for the same reason as above: it is the gate that stops
      # a new migration from introducing an unclassified table.
      - name: Ownership registry vs. the live schema
        working-directory: backend
        run: |
          set -euo pipefail
          go test ./internal/sync/ownership/ -v | tee /tmp/ownership.out
          grep -q "^--- PASS: TestRegistryCoversTheSchema " /tmp/ownership.out \
            || { echo "::error::the registry/schema totality check did not run" >&2; exit 1; }

      # -----------------------------------------------------------------------
      # HTTP smoke suites
      #
      # Steps:
      #  1. Run migrations against the CI Postgres via `go run ./cmd/migrate --up`.
      #     The migrate command reads DATABASE_URL from the environment (APP_ENV=local
      #     causes config.Load to look for a .env file which won't exist in CI, but
      #     the DATABASE_URL env var is already set above so it wins).
      #  2. Start the server in the background on port 8080.
      #  3. Wait until GET /health returns 200 (up to 30 s).
      #  4. Run the full HTTP smoke suite with `go run ./cmd/tests --all`.
      # -----------------------------------------------------------------------

      - name: Migrate database
        working-directory: backend
        run: go run ./cmd/migrate --up

      - name: Provision non-superuser app role
        working-directory: backend
        # The server must NOT connect as the migration/admin role: Postgres skips
        # ALL row-level security for a superuser/BYPASSRLS role even under FORCE
        # RLS, which silently disables tenant isolation (and makes the
        # cross-tenant smoke suite vacuous — one org can read another's data).
        # Create a NOSUPERUSER NOBYPASSRLS role and run the server as it, exactly
        # as the integration tests do (testenv's bb_app).
        env:
          APP_DB_PASSWORD: ci-bb-app-pw
        run: go run ./cmd/setupapprole

      - name: Start server in background
        working-directory: backend
        # DATABASE_URL overridden to the non-superuser bb_app role so RLS is
        # enforced (the job-level DATABASE_URL is the admin role used for
        # migration + role provisioning above). APP_ENV, JWT_SECRET, PORT still
        # come from the job-level env block.
        env:
          DATABASE_URL: postgres://bb_app:ci-bb-app-pw@localhost:5432/beepbite_ci?sslmode=disable
        run: go run ./cmd/server &

      - name: Wait for server /health
        # Poll /health with a 1-second back-off for up to 30 seconds.
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "Server is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become healthy within 30 seconds" >&2
          exit 1

      - name: Run HTTP smoke suites (--all)
        working-directory: backend
        # The tests runner reads APP_ENV to find the port (defaults to 8080).
        # --all exercises: sanity, auth, pentest, menu, recipes, orders, members,
        # whatsapp, onboarding, pos, kds, cashdrawer, adjustments.
        run: go run ./cmd/tests --all

  # ---------- Shared merge engine: frozen conformance vectors ----------
  # internal/sync/substrate runs the shared DMTAP-SYNC engine, and the whole
  # justification for calling it that is this job. It drives all 24 of
  # SYNC.md §10's frozen conformance vectors through the engine the binary
  # links and compares the results byte-for-byte against the frozen file.
  #
  # It is a separate job rather than a step in go-build because it needs a
  # second checkout (the vectors live in vul-os/kotva, not here) and because a
  # red tick on THIS job has a specific meaning: the engine's algebra moved, or
  # the vectors moved, and BeepBite's merge semantics are downstream of both.
  #
  # Why not `go test github.com/vul-os/kotva/bindings/go` instead: that module's
  # own vectors_test.go resolves a native trace through a path that is not in
  # the module zip and not overridable, so its tests can never pass from a proxy
  # fetch. BeepBite carries its own driver, as FlowStock does.
  sync-vectors:
    name: DMTAP-SYNC conformance vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # Read the engine's version out of go.mod rather than duplicating it
      # here, so the pin stays written down where the toolchain enforces it.
      # kotva tags its Go submodule as bindings/go/<version>, and the vectors
      # at that tag are the ones the engine in that version was proved against.
      - name: Resolve the engine's pinned version
        id: pin
        working-directory: backend
        run: |
          ver="$(go list -m -f '{{.Version}}' github.com/vul-os/kotva/bindings/go)"
          if [ -z "$ver" ]; then
            echo "::error::backend/go.mod does not require github.com/vul-os/kotva/bindings/go"
            exit 1
          fi
          echo "ref=bindings/go/$ver" >> "$GITHUB_OUTPUT"
          echo "engine module version: $ver"

      # vul-os/kotva is public, so this needs no token. If it ever fails the
      # job fails — which is the point: no vector cross-check, no green tick.
      - name: Check out the substrate repo at the engine's tag
        uses: actions/checkout@v4
        with:
          repository: vul-os/kotva
          ref: ${{ steps.pin.outputs.ref }}
          path: .upstream-kotva

      # BEEPBITE_REQUIRE_SYNC_VECTORS turns the driver's "no checkout, so
      # nothing was verified" skip into a failure. A guard that has quietly
      # stopped running looks identical, from a green run, to one that works.
      - name: Drive the frozen vectors
        working-directory: backend
        env:
          KOTVA_DIR: ${{ github.workspace }}/.upstream-kotva
          BEEPBITE_REQUIRE_SYNC_VECTORS: '1'
        # pipefail explicitly, not by runner default: without it the pipeline's
        # status is tee's and a failing `go test` would report success. This is
        # the gate the package's name rests on; it does not get to depend on
        # what shell options a runner image happens to set.
        run: |
          set -euo pipefail
          go test ./internal/sync/substrate/ -run TestFrozenSyncVectors -v | tee /tmp/vectors.out

      # Exit 0 is not the assertion. A driver that recognised no vectors, or a
      # `-run` pattern that matched nothing, both exit 0 — so the count is
      # checked here as well as inside the test, and the number is written out
      # so a reader of the log can see what was actually covered.
      - name: Assert all 24 vectors were driven
        run: |
          set -euo pipefail
          if ! grep -q 'drove all 24 frozen SYNC conformance vectors' /tmp/vectors.out; then
            echo "::error::the conformance driver did not report driving all 24 vectors"
            exit 1
          fi
          echo "24/24 frozen SYNC conformance vectors driven"

  # ---------- Frontend ----------
  frontend:
    name: Frontend build + unit tests
    runs-on: ubuntu-latest
    # The frontend project (package.json, src/, ...) lives under web/.
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Fail if docs/ was edited without re-running the site/docs mirror — the
      # whole point of sync-docs.mjs is that the published viewer never serves
      # stale copies. A hard gate (unlike lint) since it is deterministic.
      # sync-docs.mjs itself stays at the repo-root scripts/ (it reaches
      # root-level docs/ and site/, not just the frontend), so this npm
      # script reaches it via a relative ../scripts/ path.
      - name: Docs mirror in sync (docs/ -> site/docs/)
        run: npm run docs:check

      - name: ESLint
        run: npm run lint

      # ESLint's type-aware rules (no-floating-promises, no-unsafe-*, etc.)
      # only run on the files they're pointed at and only report what those
      # rules individually check — they are not a substitute for a real
      # whole-project `tsc --noEmit`, and nothing else in this job was
      # actually invoking one: `vite build` below compiles through esbuild,
      # which strips types without checking them, so a real type error could
      # reach this point with every prior step green.
      - name: TypeScript typecheck
        run: npm run typecheck

      # check:lint-config below is itself the gate that proves the lint config
      # is genuinely type-aware — but the gate script was unchecked JavaScript.
      # scripts/tsconfig.json (allowJs+checkJs+strict) type-checks it via JSDoc
      # without dragging script files into the app's own tsconfig.json/build
      # surface. BLOCKING: an unwired typecheck cannot fail a build, which is the
      # same hollow-gate shape this file's other steps exist to catch.
      - name: Typecheck CI scripts (check-lint-config.mjs)
        run: npm run typecheck:scripts

      # Unlike the ESLint step above, which fails on lint errors, this one
      # fails when the lint config itself stops being able to find them: it
      # doesn't care how many lint findings there are, only that type-aware
      # linting is actually resolving type information, typescript is pinned
      # to the version node_modules actually has installed, and ESLint is
      # still covering the real file count. See web/scripts/check-lint-config.mjs.
      - name: Lint config actually does what it claims
        run: npm run check:lint-config

      - name: Vite build (catches bundler errors)
        run: npm run build

      - name: Vitest unit tests
        run: npm run test:unit

  # ---------- Release verifier ----------
  # scripts/verify.sh is what a user runs before executing a downloaded
  # binary, and its REFUSALS are the whole product. A checksum guard that has
  # quietly stopped failing looks identical, from a green CI run, to one that
  # works — so run the full synthetic-origin failure matrix on every push, not
  # only at release time.
  verify-script:
    name: Release verifier — lint & failure matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: bash -n scripts/verify.sh

      - name: ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/verify.sh

      # Each case is a synthetic origin broken in exactly one way; the matrix
      # asserts the exit code AND that a diagnostic was printed, because
      # "aborted with no message" was the real-world bug being guarded against.
      - name: Failure matrix (synthetic origin)
        run: bash scripts/verify.sh --selftest

  # ---------- Playwright E2E (optional) ----------
  # Runs only when a browser binary is available.
  # Disabled by default on ubuntu-latest because Playwright's bundled Chromium
  # does not support Ubuntu 26+. Enable once you pin to ubuntu-22.04 or use
  # the mcr.microsoft.com/playwright Docker image.
  #
  # Uncomment to activate:
  #
  # e2e:
  #   name: Playwright render smoke
  #   runs-on: ubuntu-22.04
  #   defaults:
  #     run:
  #       working-directory: web
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: '20'
  #         cache: 'npm'
  #         cache-dependency-path: web/package-lock.json
  #     - run: npm ci
  #     - run: npx playwright install chromium --with-deps
  #     - run: npm run test:e2e
  #   env:
  #     CI: true
