<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>BeepBite | The restaurant point-of-sale you actually own</title>
    <meta name="description" content="BeepBite is a self-hosted restaurant point-of-sale: till, kitchen display, floor plan, inventory and delivery on your own hardware and your own database. No cloud account, no per-order fee, nothing phones home." />
    <meta name="keywords" content="restaurant POS, point of sale, self-hosted POS, kitchen display system, KDS, restaurant management, floor plan, table management, restaurant inventory" />
    <meta name="author" content="BeepBite" />
    <meta name="robots" content="index, follow" />

    <!--
      No canonical or absolute og:url here on purpose. This is the app shell
      of a self-hosted product: every deployment lives on the operator's own
      hostname, so a canonical pointing at one domain would tell crawlers that
      every restaurant's till belongs to somebody else's site. (It used to
      point at beepbite.io, which nobody operates.) The marketing page that
      *does* have a canonical home is site/index.html.
    -->

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.png" />

    <!-- Open Graph / Facebook — relative image, host-agnostic -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BeepBite | The restaurant point-of-sale you actually own" />
    <meta property="og:description" content="Till, kitchen display, floor plan, inventory and delivery on your own hardware and your own database. No cloud account, no per-order fee, nothing phones home." />
    <meta property="og:image" content="/icon.png" />
    <meta property="og:site_name" content="BeepBite" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="BeepBite | The restaurant point-of-sale you actually own" />
    <meta property="twitter:description" content="Till, kitchen display, floor plan, inventory and delivery on your own hardware and your own database. No cloud account, no per-order fee, nothing phones home." />
    <meta property="twitter:image" content="/icon.png" />

    <!-- Additional SEO -->
    <meta name="theme-color" content="#c0420c" />
    <meta name="application-name" content="BeepBite" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
